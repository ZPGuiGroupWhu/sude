[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sude"
version = "0.2.0"
description = "Optimized SUDE manifold learning with a scikit-learn compatible API."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "pdh", email = "pengdh@whu.edu.cn"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "manifold learning",
    "dimension reduction",
    "embedding",
    "landmark sampling",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.8",
    "scikit-learn>=1.3.2",
]

[project.optional-dependencies]
accelerate = [
    "numba>=0.57",
]
test = [
    "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/ZPGuiGroupWhu/SUDE-pkg"
Repository = "https://github.com/ZPGuiGroupWhu/SUDE-pkg.git"
Issues = "https://github.com/ZPGuiGroupWhu/SUDE-pkg/issues"

[tool.setuptools.packages.find]
include = ["sude*"]
exclude = ["sude.tests*"]

[tool.pytest.ini_options]
testpaths = ["sude/tests"]
addopts = "--color=yes"
